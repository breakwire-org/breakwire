[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "breakwire"
version = "0.2.0"
description = "Look up an API/SDK error and get the source-linked breaking change, deprecation or advisory that explains it, with the fix. Stdlib only."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Breakwire" }]
keywords = ["breaking-changes", "deprecations", "errors", "ai-agents", "llm", "mcp", "anthropic", "openai", "gemini"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://breakwire.org"
Documentation = "https://breakwire.org/llms.txt"
Source = "https://github.com/breakwire-org/breakwire/tree/main/packages/python"
Issues = "https://github.com/breakwire-org/breakwire/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
breakwire = ["py.typed"]
