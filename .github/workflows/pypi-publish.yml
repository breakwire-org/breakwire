name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package directory to publish"
        required: true
        type: choice
        options:
          - python
          - langchain-breakwire

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build packages/${{ inputs.package }} --outdir dist
      - name: Publish (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
